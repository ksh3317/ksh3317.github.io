<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 204 170">
<style>.wobble{animation:wobble 2.6s ease-in-out infinite;transform-origin:50% 100%;transform-box:fill-box}@keyframes wobble{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.96)}}.blink{animation:blink 4s infinite;transform-origin:center;transform-box:fill-box}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}.cursor{animation:cur 1s steps(1) infinite}@keyframes cur{50%{opacity:0}}@media (prefers-reduced-motion:reduce){.wobble,.blink,.cursor{animation:none}}</style>
